name: publisher CI

on:
  push:
    paths:
      - 'publisher/**'
      - '.github/workflows/publisher-ci.yml'
  pull_request:
    paths:
      - 'publisher/**'
      - '.github/workflows/publisher-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
